<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script></head><body>
<script type="module">
// Turkish Coffee Lady sergisi: premium kaide (yivli krem mermer gövde, pirinç halkalar, tadın renginde mine halka,
// iki basamak), çevresinde kahve çekirdekleri ve buz, tepeden spot ışığı. Üç kip:
//   stage   : şehir fonu + kaide (kutusuz; sitedeki 3B kutu üstüne oturur)  → 1086x1448, meta (base, h)
//   card    : şehir fonu + kaide + kutu (koleksiyon kartı, 3:4)               → 900x1200
//   exhibit : şeffaf zemin, kaide + kutu (tat bulucu ve hikâye sahnesi)       → 800x1400
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const q = new URLSearchParams(location.search);
const key = q.get('k'); const band = new THREE.Color(q.get('c') || '#c9a15c'); const mode = q.get('m') || 'stage';
const [W, H] = { stage: [1086, 1448], card: [900, 1200], exhibit: [1100, 1400], plinth: [1100, 1400] }[mode];
const SHOWCAN = mode === 'card' || mode === 'exhibit'; const CLEAR = mode === 'exhibit' || mode === 'plinth';
const r = new THREE.WebGLRenderer({ antialias: true, alpha: CLEAR, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5;

// ---- kamera
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
if (mode === 'stage') { cam.position.set(0, 1.25, 8.6); cam.lookAt(0, 0.75, 0); }
if (mode === 'card') { cam.position.set(0, 1.55, 9.4); cam.lookAt(0, 0.72, 0); }
if (CLEAR) { cam.fov = 24; cam.updateProjectionMatrix(); cam.position.set(0, 1.5, 11.6); cam.lookAt(0, 0.82, 0); }

let pending = 0; const done = () => { if (--pending === 0) setTimeout(draw, 80); };
const load = (u) => { pending++; const t = new THREE.TextureLoader().load(u, done); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

// ---- fon: şehrin suluboya çizimi
if (!CLEAR) {
  const bdTex = load(`bdc-${key}.jpg`);
  const bd = new THREE.Mesh(new THREE.PlaneGeometry(12.6, 8.4), new THREE.MeshBasicMaterial({ map: bdTex, toneMapped: false, fog: false }));
  bd.position.set(0, 1.2, -4.2); scene.add(bd);
  scene.fog = new THREE.Fog(0x2a221c, 9, 16);
}

// ---- mermer dokusu (krem, ince altın-gri damarlar)
function marble(seed, base = [238, 226, 206]) {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 512; const g = c.getContext('2d');
  g.fillStyle = `rgb(${base})`; g.fillRect(0, 0, 2048, 512);
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(${200 + rnd() * 40},${190 + rnd() * 40},${170 + rnd() * 40},0.05)`; g.beginPath(); g.arc(rnd() * 2048, rnd() * 512, 6 + rnd() * 40, 0, 7); g.fill(); }
  for (let v = 0; v < 42; v++) {
    let x = rnd() * 2048, y = rnd() * 512; const a = rnd() * 0.7 - 0.35; const w = 0.4 + rnd() * 1.6;
    g.strokeStyle = rnd() > 0.6 ? `rgba(168,128,70,${0.45 + rnd() * 0.35})` : `rgba(120,108,96,${0.3 + rnd() * 0.3})`; g.lineWidth = w * 1.4;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 40; k++) { x += 14 + rnd() * 26; y += Math.sin(k * 0.4 + v) * 6 + (rnd() - 0.5) * 10 + a * 20; g.lineTo(x, y); }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
const stoneMat = (seed, base) => new THREE.MeshPhysicalMaterial({ map: marble(seed, base), roughness: 0.3, clearcoat: 0.7, clearcoatRoughness: 0.12, envMapIntensity: 0.8 });
const brass = new THREE.MeshPhysicalMaterial({ color: 0xc9a15c, metalness: 1, roughness: 0.24, clearcoat: 0.4 });
const enamel = new THREE.MeshPhysicalMaterial({ color: band, metalness: 0.1, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.05 });

// ---- kaide: üst yüz y=0. Gövde yivli (36 yiv), üstte pirinç başlık ve mine halka; altta iki basamak.
const P = new THREE.Group(); scene.add(P);
const PR = 0.92, PH = 0.66;
function fluted(R, h, n, depth) {
  const g = new THREE.CylinderGeometry(R, R, h, 360, 1, true);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i); const a = Math.atan2(z, x);
    const k = 1 - depth * Math.pow(Math.abs(Math.cos(a * n / 2)), 0.6);
    pos.setX(i, x * k); pos.setZ(i, z * k);
  }
  g.computeVertexNormals(); return g;
}
const body = new THREE.Mesh(fluted(PR * 0.96, PH - 0.12, 30, 0.045), stoneMat(7)); body.position.y = -0.09 - (PH - 0.12) / 2; P.add(body);
const core = new THREE.Mesh(new THREE.CylinderGeometry(PR * 0.92, PR * 0.92, PH - 0.12, 64), stoneMat(7)); core.position.copy(body.position); P.add(core);
// pirinç başlık + mermer üst plaka + mine halka
const capB = new THREE.Mesh(new THREE.CylinderGeometry(PR * 1.04, PR * 1.0, 0.05, 160), brass); capB.position.y = -0.065; P.add(capB);
const top = new THREE.Mesh(new THREE.CylinderGeometry(PR * 1.02, PR * 1.02, 0.04, 160), stoneMat(11, [248, 242, 232])); top.position.y = -0.02; P.add(top);
const ring = new THREE.Mesh(new THREE.TorusGeometry(PR * 0.86, 0.014, 16, 200), enamel); ring.rotation.x = Math.PI / 2; ring.position.y = 0.0; P.add(ring);
const ring2 = new THREE.Mesh(new THREE.TorusGeometry(PR * 1.025, 0.012, 12, 200), brass); ring2.rotation.x = Math.PI / 2; ring2.position.y = -0.0; P.add(ring2);
// gövde altında pirinç bilezik
const foot = new THREE.Mesh(new THREE.TorusGeometry(PR * 0.965, 0.022, 16, 200), brass); foot.rotation.x = Math.PI / 2; foot.position.y = -PH + 0.04; P.add(foot);
// basamaklar
const step1 = new THREE.Mesh(new THREE.CylinderGeometry(PR * 1.32, PR * 1.36, 0.13, 160), stoneMat(23, [236, 226, 210])); step1.position.y = -PH - 0.065; P.add(step1);
const st1b = new THREE.Mesh(new THREE.TorusGeometry(PR * 1.33, 0.01, 12, 200), brass); st1b.rotation.x = Math.PI / 2; st1b.position.y = -PH; P.add(st1b);
const step2 = new THREE.Mesh(new THREE.CylinderGeometry(PR * 1.62, PR * 1.66, 0.1, 160), stoneMat(31, [228, 216, 198])); step2.position.y = -PH - 0.13 - 0.05; P.add(step2);
P.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
const FLOOR = -PH - 0.23;

// ---- zemin (gölge) — exhibit'te gölge şeffaf zeminde
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.ShadowMaterial({ opacity: CLEAR ? 0.35 : 0.45 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR; floor.receiveShadow = true; scene.add(floor);

// ---- kahve çekirdekleri ve buz küpleri (yanlarda ve önde aşağıda: kutunun önüne binmez)
let s = 99; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const beanGeo = (() => { const g = new THREE.SphereGeometry(1, 40, 28); const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i); // düz yüzde ortadan geçen yarık
    const flat = y > 0 ? 0.55 : 1; const groove = y > 0 ? 0.22 * Math.exp(-Math.pow(x / 0.12, 2)) : 0; p.setY(i, y * flat - groove); }
  g.computeVertexNormals(); g.scale(0.085, 0.05, 0.062); return g; })();
const beanMat = new THREE.MeshPhysicalMaterial({ color: 0x3a2214, roughness: 0.38, clearcoat: 0.6, clearcoatRoughness: 0.3, sheen: 0.3 });
const iceMat = new THREE.MeshPhysicalMaterial({ color: 0xf4fbff, roughness: 0.06, transmission: 0.92, thickness: 0.25, ior: 1.31, clearcoat: 1, transparent: true, opacity: 0.92 });
function bean(x, y, z, ry) { const b = new THREE.Mesh(beanGeo, beanMat); b.position.set(x, y + 0.03, z); b.rotation.set(rnd() * 0.5, ry, rnd() * 0.4); b.castShadow = true; scene.add(b); }
function ice(x, y, z, sz, ry) { const c = new THREE.Mesh(new RoundedBoxGeometry(sz, sz, sz, 4, sz * 0.18), iceMat); c.position.set(x, y + sz / 2, z); c.rotation.set(0.1, ry, 0.08); c.castShadow = true; scene.add(c); }
// alt basamakta (önde, iki yana) ve zeminde
const yS1 = -PH, yS2 = -PH - 0.13;
for (const [a, rr, yy] of [[-2.2, 1.12, yS1], [-2.45, 1.16, yS1], [-0.7, 1.12, yS1], [2.35, 1.14, yS1], [0.75, 1.13, yS1], [2.05, 1.38, yS2], [-1.95, 1.4, yS2], [0.35, 1.42, yS2]])
  bean(Math.sin(a) * rr * PR / 0.92, yy, Math.cos(a) * rr * PR / 0.92, rnd() * 6);

for (let i = 0; i < 9; i++) { const a = (rnd() - 0.5) * 2.6 + (i % 2 ? Math.PI * 0.5 : -Math.PI * 0.5); const rr = 1.9 + rnd() * 0.9; bean(Math.sin(a) * rr, FLOOR, Math.cos(a) * rr * 0.7 + 0.2, rnd() * 6); }

// ---- kutu (card/exhibit): render/index.html ile aynı form
if (SHOWCAN) {
  const R = 0.53, HC = 2.68;
  const pts = [[0, 0.06], [0.30, 0.055], [0.40, 0.02], [0.47, 0.0], [0.50, 0.012], [0.525, 0.05], [R, 0.11], [R, HC * 0.895], [0.515, HC * 0.925], [0.47, HC * 0.958], [0.46, HC * 0.975], [0.468, HC * 0.99], [0.472, HC], [0.455, HC * 1.003], [0.44, HC * 0.99], [0.43, HC * 0.982], [0, HC * 0.982]];
  const metal = new THREE.MeshPhysicalMaterial({ color: 0xd9dde2, metalness: 1, roughness: 0.26, clearcoat: 0.3 });
  const can = new THREE.Group();
  can.add(new THREE.Mesh(new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), 128), metal));
  const tex = load(`labels/${key}.png`);
  const lb = 0.115, lt = HC * 0.893;
  const label = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.002, R + 0.002, lt - lb, 192, 1, true, Math.PI, Math.PI * 2),
    new THREE.MeshPhysicalMaterial({ map: tex, metalness: 0.25, roughness: 0.36, clearcoat: 0.7, clearcoatRoughness: 0.15 }));
  label.position.y = (lb + lt) / 2; can.add(label);
  const tab = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.16, 6, 16), metal); tab.rotation.x = -Math.PI / 2; tab.rotation.z = Math.PI / 2; tab.scale.set(1, 1, 0.12);
  tab.position.set(0, HC * 0.985, 0.12); can.add(tab);
  can.rotation.y = -0.05; can.traverse((m) => { if (m.isMesh) m.castShadow = true; });
  scene.add(can);
  // buğu: kutunun üstünde ince su damlacıkları yerine soğuk parıltı (rim)
}

// ---- ışık: tepeden spot (kaidede ışık havuzu), sıcak ana ışık, tadın renginde arka kenar ışıkları
const spot = new THREE.SpotLight(0xfff3e0, 75, 16, 0.32, 0.55, 1.3); spot.position.set(0.3, 7.5, 2.2); spot.target.position.set(0, 0, 0);
spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.radius = 6; scene.add(spot, spot.target);
if (!CLEAR) {
  const cc = document.createElement('canvas'); cc.width = 512; cc.height = 1024; const cg = cc.getContext('2d');
  cg.filter = 'blur(38px)';
  const lg2 = cg.createLinearGradient(0, 0, 0, 1024); lg2.addColorStop(0, 'rgba(255,238,210,0.0)'); lg2.addColorStop(0.3, 'rgba(255,238,210,0.22)'); lg2.addColorStop(0.92, 'rgba(255,238,210,0.5)'); lg2.addColorStop(1, 'rgba(255,238,210,0.0)');
  cg.fillStyle = lg2; cg.beginPath(); cg.moveTo(206, 0); cg.lineTo(306, 0); cg.lineTo(470, 1000); cg.lineTo(42, 1000); cg.closePath(); cg.fill();
  const ct = new THREE.CanvasTexture(cc);
  const cone = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 7), new THREE.MeshBasicMaterial({ map: ct, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, opacity: 0.55 }));
  cone.position.set(0, 3.1, -1.2); cone.lookAt(cam.position.x, 3.1, cam.position.z); scene.add(cone);
}
const key1 = new THREE.DirectionalLight(0xffeedd, 0.55); key1.position.set(-4, 4, 6); scene.add(key1);
const rimL = new THREE.PointLight(band.clone().lerp(new THREE.Color(1, 1, 1), 0.35), 14, 9); rimL.position.set(-2.6, 1.6, -1.6); scene.add(rimL);
const rimR = new THREE.PointLight(band.clone().lerp(new THREE.Color(1, 1, 1), 0.35), 14, 9); rimR.position.set(2.6, 1.6, -1.6); scene.add(rimR);
scene.add(new THREE.HemisphereLight(0xfff7ea, 0x5a4a3a, CLEAR ? 0.5 : 0.28));

function draw() {
  r.render(scene, cam);
  const p = (y) => { const v = new THREE.Vector3(0, y, 0).project(cam); return (1 - v.y) / 2; };
  window.__meta = { aspect: +(W / H).toFixed(4), base: +p(0).toFixed(4), cx: 0.5, h: +(p(0) - p(2.68)).toFixed(4) };
  window.__done = true;
}
if (pending === 0) setTimeout(draw, 80);  // dokusuz kip (boş kaide)
</script></body></html>
