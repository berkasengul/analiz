<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const key = q.get('k'); const band = q.get('c') || '#c9a15c';
const W = 1086, H = 1448;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); cam.position.set(0, 1.25, 8.6); cam.lookAt(0, 0.75, 0);
const tex = new THREE.TextureLoader().load(`bd-${key}.jpg`, () => setTimeout(draw, 50)); tex.colorSpace = THREE.SRGBColorSpace;
// Arka plan: şehrin suluboya çizimi (ışıktan bağımsız, kâğıt gibi)
const bd = new THREE.Mesh(new THREE.PlaneGeometry(12.6, 8.4), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, fog: false }));
bd.position.set(0, 1.2, -4.2); scene.add(bd);
// Zemin: krem taş, arka plana doğru açılan
const floorMat = new THREE.ShadowMaterial({ opacity: 0.16 });
scene.fog = new THREE.Fog(0xf2e9d8, 7.5, 12.5);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 14), floorMat); floor.rotation.x = -Math.PI / 2; floor.position.y = -0.72; floor.receiveShadow = true; scene.add(floor);
// Kaide: travertene benzer krem taş silindir, üstte tadın renginde ince bir hat
const stone = new THREE.MeshPhysicalMaterial({ color: 0xf7eedd, roughness: 0.46, clearcoat: 0.25, clearcoatRoughness: 0.4 });
const PH = 0.72, PR = 0.95;
const pl = new THREE.Mesh(new THREE.CylinderGeometry(PR, PR * 1.02, PH, 128), stone); pl.position.y = -0.72 + PH / 2; pl.castShadow = true; pl.receiveShadow = true; scene.add(pl);
const lip = new THREE.Mesh(new THREE.CylinderGeometry(PR * 1.06, PR * 1.06, 0.07, 128), stone); lip.position.y = 0.0 - 0.035; lip.castShadow = true; scene.add(lip);
const ring = new THREE.Mesh(new THREE.TorusGeometry(PR * 1.005, 0.012, 12, 160), new THREE.MeshStandardMaterial({ color: band, metalness: 0.6, roughness: 0.3 }));
ring.rotation.x = Math.PI / 2; ring.position.y = -0.12; scene.add(ring);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2); sun.position.set(-4, 7, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4; sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4; sun.shadow.radius = 8; scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(5, 2, 4); scene.add(fill);
scene.add(new THREE.HemisphereLight(0xfff7ea, 0xd8c8b0, 0.6));
function draw() {
  r.render(scene, cam);
  const p = (y) => { const v = new THREE.Vector3(0, y, 0).project(cam); return (1 - v.y) / 2; };
  // Kaidenin üst yüzü y=0; 250 ml kutu boyu 2.68 birim (0,1 m)
  window.__meta = { aspect: +(W / H).toFixed(4), base: +p(0).toFixed(4), cx: 0.5, h: +(p(0) - p(2.68)).toFixed(4) };
  window.__done = true;
}
</script></body></html>
