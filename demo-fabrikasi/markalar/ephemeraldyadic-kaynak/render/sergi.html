<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script></head><body>
<script type="module">
// Ephemeral Dyadic sergisi: İstanbul'daki sanayi atölyesi. Koyu beton duvar, kokunun kutu deseni duvarda dev bir
// baskı; şişe ham beton bir kaidede (üstte şişe kapağıyla aynı fırçalanmış çelik plaka), tepeden tek spot ışığı.
// Kipler: stage (kaide, şişesiz; site 3B şişeyi koyar) · card (3:4, şişe fotoğrafı kaidede) · exhibit / plinth (şeffaf)
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const q = new URLSearchParams(location.search);
const key = q.get('k'); const juice = new THREE.Color(q.get('c') || '#d9c47a'); const mode = q.get('m') || 'stage';
const [W, H] = { stage: [1086, 1448], card: [900, 1200], exhibit: [1000, 1400], plinth: [1000, 1400], wall: [1600, 1000] }[mode];
const SHOW = mode === 'card' || mode === 'exhibit'; const CLEAR = mode === 'exhibit' || mode === 'plinth';
const r = new THREE.WebGLRenderer({ antialias: true, alpha: CLEAR, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.35;
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
if (mode === 'stage') { cam.position.set(0, 1.2, 8.6); cam.lookAt(0, 0.75, 0); }
if (mode === 'wall') { cam.position.set(0, 1.4, 9.5); cam.lookAt(0, 1.3, 0); }
if (mode === 'card') { cam.position.set(0, 1.45, 9.2); cam.lookAt(0, 0.62, 0); }
if (CLEAR) { cam.fov = 24; cam.updateProjectionMatrix(); cam.position.set(0, 1.4, 10.6); cam.lookAt(0, 0.55, 0); }
let pending = 0; const done = () => { if (--pending === 0) setTimeout(draw, 80); };
const load = (u, srgb = true) => { pending++; const t = new THREE.TextureLoader().load(u, done); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

// ---- beton dokusu (gözenekli, lekeli)
function concrete(seed, base, size = 1024) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  g.fillStyle = `rgb(${base})`; g.fillRect(0, 0, size, size);
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 2400; i++) { const v = rnd() > 0.5 ? 255 : 0; g.fillStyle = `rgba(${v},${v},${v},${0.012 + rnd() * 0.02})`; g.beginPath(); g.arc(rnd() * size, rnd() * size, 3 + rnd() * 26, 0, 7); g.fill(); }
  const img = g.getImageData(0, 0, size, size); const d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 18; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < 700; i++) { g.fillStyle = `rgba(30,30,30,${0.2 + rnd() * 0.35})`; g.beginPath(); g.arc(rnd() * size, rnd() * size, 0.5 + rnd() * 1.6, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}

if (!CLEAR) {
  // duvar ve zemin
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(16, 10), new THREE.MeshStandardMaterial({ map: concrete(5, [44, 43, 42]), roughness: 0.92 }));
  wall.position.set(0, 2.6, -4.2); wall.receiveShadow = true; scene.add(wall);
  const ft = concrete(9, [34, 33, 32]); ft.repeat.set(3, 3);
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), new THREE.MeshPhysicalMaterial({ map: ft, roughness: 0.42, clearcoat: 0.5, clearcoatRoughness: 0.3 }));
  fl.rotation.x = -Math.PI / 2; fl.position.set(0, -1.02, 1.6); fl.receiveShadow = true; scene.add(fl);
  // kokunun kutu deseni: duvarda dev baskı (ince siyah kenar, duvardan biraz önde, gölge düşürür)
  const art = load(`art/${key}.png`);
  const print = new THREE.Mesh(new THREE.BoxGeometry(3.5, 3.5, 0.05), [0, 0, 0, 0, 0, 0].map((_, i) => i === 4 ? new THREE.MeshStandardMaterial({ map: art, roughness: 0.85 }) : new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 })));
  print.position.set(0, 2.55, -4.05); print.castShadow = true; print.receiveShadow = true; scene.add(print);
  // baskıyı aydınlatan geniş, yumuşak ışık
  const wash = new THREE.SpotLight(0xfff4e6, 70, 14, 0.42, 0.85, 1.2); wash.position.set(0, 6.5, 2.5); wash.target.position.set(0, 2.55, -4.05); scene.add(wash, wash.target);
  scene.fog = new THREE.Fog(0x161615, 10, 18);
}

// ---- kaide: ham beton blok, üstte fırçalanmış çelik plaka (şişe kapağıyla aynı malzeme); üst yüz y=0
const P = new THREE.Group(); scene.add(P);
const BW = 1.9, BH = 1.0;
const cTex = concrete(17, [168, 165, 160]); cTex.repeat.set(1.4, 0.8);
const block = new THREE.Mesh(new RoundedBoxGeometry(BW, BH, BW * 0.82, 4, 0.03), new THREE.MeshStandardMaterial({ map: cTex, roughness: 0.88 }));
block.position.y = -0.045 - BH / 2; P.add(block);
const steel = new THREE.MeshPhysicalMaterial({ color: 0x8a8d90, metalness: 1, roughness: 0.38, clearcoat: 0.2 });
const plate = new THREE.Mesh(new RoundedBoxGeometry(BW * 0.98, 0.045, BW * 0.8, 3, 0.01), steel); plate.position.y = -0.0225; P.add(plate);
// kokunun renginde ince bir çizgi (plakanın ön kenarı)
const line = new THREE.Mesh(new THREE.BoxGeometry(BW * 0.98, 0.008, 0.008), new THREE.MeshStandardMaterial({ color: juice, emissive: juice, emissiveIntensity: 0.4 }));
line.position.set(0, -0.046, BW * 0.4 + 0.004); P.add(line);
P.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
if (mode === 'wall') P.visible = false;  // hikâye bölümünün duvarı: kaide sayfada ayrı (exhibit)
const FLOOR = -0.045 - BH;
const sh = new THREE.Mesh(new THREE.PlaneGeometry(30, 20), new THREE.ShadowMaterial({ opacity: CLEAR ? 0.4 : 0.5 }));
sh.rotation.x = -Math.PI / 2; sh.position.y = FLOOR + 0.002; sh.receiveShadow = true; scene.add(sh);

// ---- şişe (card/exhibit): fotoğraftan kesilmiş şişe, kaidede (ışığı fotoğrafın kendi ışığı), altta temas gölgesi
const BOT = 2.2;
if (SHOW) {
  const ct = load(`cut/${key}.webp`);
  pending++; const im = new Image(); im.onload = () => {
    const w = BOT * im.width / im.height;
    const bottle = new THREE.Mesh(new THREE.PlaneGeometry(w, BOT), new THREE.MeshBasicMaterial({ map: ct, transparent: true, alphaTest: 0.02, toneMapped: false }));
    bottle.position.set(0, BOT / 2, 0.05); scene.add(bottle);
    // gölge için aynı silüette görünmez bir yüzey
    const caster = new THREE.Mesh(new THREE.PlaneGeometry(w, BOT), new THREE.MeshBasicMaterial({ map: ct, alphaTest: 0.5, colorWrite: false, depthWrite: false }));
    caster.position.copy(bottle.position); caster.castShadow = true; scene.add(caster);
    caster.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: ct, alphaTest: 0.5 });
    done();
  }; im.src = `cut/${key}.webp`;
  const blob = new THREE.Mesh(new THREE.CircleGeometry(0.5, 48), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.scale.set(1, 0.35, 1); blob.position.set(0, 0.002, 0.05); scene.add(blob);
}

// ---- ışık: tepeden dar spot (kaide ve şişe), kokunun renginde arka kenar ışığı
const spot = new THREE.SpotLight(0xfff1e0, 95, 16, 0.26, 0.5, 1.3); spot.position.set(0.4, 7.8, 2.6); spot.target.position.set(0, 0, 0);
spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.radius = 5; scene.add(spot, spot.target);
const rim = new THREE.PointLight(juice.clone().lerp(new THREE.Color(1, 1, 1), 0.3), 10, 8); rim.position.set(0, 1.4, -2.2); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xf2efe8, 0x2a2826, CLEAR ? 0.55 : 0.2));
const fill = new THREE.DirectionalLight(0xffffff, CLEAR ? 0.7 : 0.25); fill.position.set(-4, 3, 6); scene.add(fill);

function draw() {
  r.render(scene, cam);
  const p = (y) => { const v = new THREE.Vector3(0, y, 0).project(cam); return (1 - v.y) / 2; };
  window.__meta = { aspect: +(W / H).toFixed(4), base: +p(0).toFixed(4), cx: 0.5, h: +(p(0) - p(BOT)).toFixed(4) };
  window.__done = true;
}
if (pending === 0) setTimeout(draw, 80);
</script></body></html>
