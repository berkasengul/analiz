<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Kale kuşatması: KayKit (CC0) karakter ve ortaçağ paketleriyle, kodla kurulmuş 3D sahne
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
const W=1920,H=1080;
const M='../assets/kaykit-medieval-hexagon-pack-1.0/addons/kaykit_medieval_hexagon_pack/Assets/gltf/';
const C='../assets/kaykit-character-pack-adventures-1.0/addons/kaykit_character_pack_adventures/Characters/gltf/';
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
R.setSize(W,H); R.setPixelRatio(1); R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.05; R.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(R.domElement);
const scene=new THREE.Scene();
// gökyüzü degrade
const sky=document.createElement('canvas'); sky.width=4; sky.height=512; const g=sky.getContext('2d');
const gr=g.createLinearGradient(0,0,0,512); gr.addColorStop(0,'#5d7fb8'); gr.addColorStop(.55,'#e9b48a'); gr.addColorStop(1,'#f6d7a8'); g.fillStyle=gr; g.fillRect(0,0,4,512);
const skyT=new THREE.CanvasTexture(sky); skyT.colorSpace=THREE.SRGBColorSpace; scene.background=skyT;
scene.fog=new THREE.Fog('#e9c6a0',55,170);
const cam=new THREE.PerspectiveCamera(38,W/H,.5,600);
scene.add(new THREE.HemisphereLight('#cfe0ff','#6b5a3a',1.1));
const sun=new THREE.DirectionalLight('#ffd9a8',3.2); sun.position.set(-60,55,40); sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096); Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:10,far:220}); sun.shadow.bias=-0.0004; sun.shadow.normalBias=.04;
scene.add(sun);
// zemin: hafif dalgalı, renk gürültülü çimen
const geo=new THREE.PlaneGeometry(420,420,140,140); geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position, cols=[];
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);
  const d=Math.hypot(x,z+10); const y=(d>45? (d-45)*.06:0)*Math.sin(x*.05+z*.03)*1.6 + .25*Math.sin(x*.21)*Math.cos(z*.17);
  pos.setY(i,y); const n=.5+.5*Math.sin(x*.37+Math.cos(z*.29)*2)*Math.cos(z*.11);
  const c=new THREE.Color().setHSL(.25+.04*n,.42,.30+.08*n); cols.push(c.r,c.g,c.b);}
geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3)); geo.computeVertexNormals();
const ground=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1})); ground.receiveShadow=true; scene.add(ground);
// toprak yol
const road=new THREE.Mesh(new THREE.PlaneGeometry(9,60),new THREE.MeshStandardMaterial({color:'#9b7a52',roughness:1})); road.rotation.x=-Math.PI/2; road.position.set(0,.06,8); road.receiveShadow=true; scene.add(road);

const L=new GLTFLoader(); const cache={};
async function load(f){ if(!cache[f]) cache[f]=await L.loadAsync(f); return cache[f]; }
function shadowy(o){o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});return o;}
async function place(f,x,z,s=3,ry=0,y=0){const g_=await load(M+f); const o=shadowy(g_.scene.clone(true)); o.scale.setScalar(s); o.position.set(x,y,z); o.rotation.y=ry; scene.add(o); return o;}

// --- kale ---
const WZ=-22;
for(let k=-3;k<=3;k++) await place(k===0?'buildings/neutral/wall_straight_gate.gltf':'buildings/neutral/wall_straight.gltf', k*6, WZ);
for(const x of [-21,21]) await place('buildings/red/building_tower_A_red.gltf', x, WZ, 3.4);
for(const x of [-9,9]) await place('buildings/red/building_tower_B_red.gltf', x, WZ-1.5, 3.0);
await place('buildings/red/building_castle_red.gltf', 0, -36, 3.6);
await place('buildings/red/building_tower_catapult_red.gltf', -14, -31, 3);
await place('buildings/red/building_church_red.gltf', 14, -33, 3, -.4);
for(const [x,z] of [[-21,WZ],[21,WZ],[0,-36]]) await place('decoration/props/flag_red.gltf', x, z, 3, 0, x===0?14.3:7.4);
// --- doğa ---
const nat=[['decoration/nature/mountain_A_grass_trees.gltf',-70,-120,9],['decoration/nature/mountain_B_grass_trees.gltf',-25,-135,10],['decoration/nature/mountain_C_grass_trees.gltf',30,-125,9],
 ['decoration/nature/mountain_A_grass_trees.gltf',80,-115,8],['decoration/nature/mountain_B_grass_trees.gltf',120,-140,10],['decoration/nature/mountain_C_grass_trees.gltf',-120,-130,9],['decoration/nature/hills_A_trees.gltf',-60,-45,7],['decoration/nature/hills_B_trees.gltf',60,-50,7],['decoration/nature/hills_C_trees.gltf',-70,10,7]];
for(const [f,x,z,s] of nat) await place(f,x,z,s,Math.random()*6);
let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
for(let i=0;i<70;i++){const x=(rnd()-.5)*180,z=(rnd()-.5)*140-10; if(Math.abs(x)<30&&z>-40&&z<40) continue;
  await place(rnd()<.5?'decoration/nature/tree_single_A.gltf':'decoration/nature/tree_single_B.gltf',x,z,3+rnd()*2,rnd()*6);}
for(let i=0;i<10;i++){const o=await place('decoration/nature/cloud_big.gltf',(rnd()-.5)*260,-90-rnd()*80,5+rnd()*3,rnd()*6,40+rnd()*16); o.traverse(m=>{if(m.isMesh){m.castShadow=false;}});}

// --- ordular ---
const units=[];
async function unit(file,x,z,ry,plan){const g_=await load(C+file); const o=shadowy(SkeletonUtils.clone(g_.scene)); o.position.set(x,0,z); o.rotation.y=ry; scene.add(o);
  const mix=new THREE.AnimationMixer(o); const clips={}; for(const a of g_.animations) clips[a.name]=a; units.push({o,mix,clips,x,z,ry,plan,cur:null}); }
// saldıranlar: şövalyeler (4 sıra × 5)
for(let r=0;r<4;r++) for(let c=0;c<5;c++){
  const x=(c-2)*2.6+(r%2)*0.6, z=26+r*3.4, stop=-13.5+r*3.4, ph=(r*5+c)*.13;
  await unit('Knight.glb',x,z,Math.PI,{type:'atk',stop,ph,row:r});
}
// savunanlar: barbarlar kapı önünde
for(let c=0;c<6;c++){ await unit('Barbarian.glb',(c-2.5)*2.7,-17.2-(c%2)*.8,0,{type:'def',ph:c*.21}); }
for(let c=0;c<4;c++){ await unit(c%2?'Rogue_Hooded.glb':'Rogue.glb',(c<2?-16:10)+(c%2)*3,WZ-0.1,0,{type:'archer',ph:c*.3}); }
for(const u of units) if(u.plan.type==='archer'){ u.o.position.y=3.3; u.o.scale.setScalar(.9); }

function play(u,name,t){ if(u.cur!==name){u.mix.stopAllAction(); u.act=u.mix.clipAction(u.clips[name]); u.act.play(); u.cur=name;} u.mix.setTime(t); }
const SPEED=3.2;
function updateUnits(t){
  for(const u of units){ const p=u.plan;
    if(p.type==='atk'){ const zt=u.z-SPEED*Math.max(0,t-p.ph*.5); const z=Math.max(p.stop,zt); u.o.position.z=z;
      if(z>p.stop+.01) play(u,'Running_A',t+p.ph);
      else { const lt=t-(u.z-p.stop)/SPEED-p.ph*.5; if(p.row===0) play(u,['1H_Melee_Attack_Chop','1H_Melee_Attack_Slice_Diagonal','1H_Melee_Attack_Stab'][Math.floor(p.ph*10)%3],(lt+p.ph)%1.2);
        else play(u,'Idle',lt+p.ph); } }
    else if(p.type==='def'){ if(t<6.5) play(u,'2H_Melee_Idle',t+p.ph); else play(u,(Math.floor(p.ph*10)%2)?'2H_Melee_Attack_Chop':'Block',(t+p.ph)%1.3); }
    else play(u,'1H_Ranged_Shooting',t+p.ph);
  }
}
// kamera yolu
function camAt(t){ const k=Math.min(1,t/12); const e=k*k*(3-2*k);
  const a=THREE.MathUtils.lerp(.15,-.75,e), rad=THREE.MathUtils.lerp(46,30,e), h=THREE.MathUtils.lerp(9,14,e);
  cam.position.set(Math.sin(a)*rad, h, 4+Math.cos(a)*rad); cam.lookAt(0,2.5,THREE.MathUtils.lerp(-6,-14,e)); }
window.renderAt=(t)=>{ updateUnits(t); camAt(t); R.render(scene,cam); return true; };
window.READY=true;
</script>
