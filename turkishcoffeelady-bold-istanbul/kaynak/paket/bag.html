<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@500;600;700&family=Chakra+Petch:wght@600;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:1456px;height:3520px;position:relative;overflow:hidden;background:#f9f9f7;font-family:Arimo,Arial,sans-serif}
  .abs{position:absolute}
  /* heat-seal crimp at the top */
  #seal{left:0;top:0;width:100%;height:118px;background:
     repeating-linear-gradient(180deg,#f4f4f2 0 9px,#e3e3e0 9px 11px,#fbfbfa 11px 14px);
     box-shadow: inset 0 -2px 0 #dcdcd8}
  #notch{left:18px;top:118px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#d9d9d5 0 35%,transparent 36%)}
  #lady{left:calc(728px - 165px);top:760px;width:330px}
  #word{left:0;width:100%;top:1230px;text-align:center;font-weight:500;font-size:84px;letter-spacing:3px;
     background:linear-gradient(180deg,#b98a72 0%,#a06a55 55%,#c49a7a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  #reg{left:1196px;top:1222px;font-size:24px;color:#a87663}
  #script{left:905px;top:1330px;width:230px;opacity:.85;filter:sepia(.6) saturate(.7) brightness(1.35)}
  .red{color:#b8303c;font-family:"Chakra Petch",sans-serif;font-weight:700;text-align:center;left:0;width:100%}
  #bold{top:1520px;font-size:76px;letter-spacing:4px}
  #trad{top:1640px;font-size:84px;line-height:1.1;letter-spacing:1px}
  #illu{left:0;top:1870px;width:1456px;height:1550px;object-fit:cover}
  #band{left:0;top:3430px;width:100%;height:90px;background:#a52733}
  #band2{left:0;top:3392px;width:100%;height:128px;background:linear-gradient(180deg,#b02d39,#9e222e)}
  .bt{color:#fff;font-family:"Chakra Petch",sans-serif;font-weight:700;text-align:center;left:0;width:100%;font-size:44px;letter-spacing:1.5px}
</style></head><body>
<div id="seal" class="abs"></div><div id="notch" class="abs"></div>
<img id="lady" class="abs" src="lady_art.png" style="mix-blend-mode:multiply">
<div id="word" class="abs">TURKISH COFFEE<span style="font-size:26px;vertical-align:52px;margin-left:4px">®</span></div>
<img id="script" class="abs" src="lady_script.png">
<div id="bold" class="abs red">BOLD ISTANBUL</div>
<div id="trad" class="abs red">Traditional Flavor<br>Strong &amp; Rich</div>
<img id="illu" class="abs" src="illu_art2.png" style="mix-blend-mode:multiply">
<div id="band2" class="abs"></div>
<div class="abs bt" style="top:3400px">Premium Ground Coffee / 100% Arabica Beans</div>
<div class="abs bt" style="top:3454px">Net wt 8.8 oz / 250 gr</div>
</body></html>
