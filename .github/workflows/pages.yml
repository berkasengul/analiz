# SESA KIDS sitesini GitHub Pages'te yayınlar (main dalına her gönderimde).
# İlk kurulum: GitHub'da Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: SEO dosyalarını güncelle
        working-directory: store
        run: node tools/seo_build.mjs
      - name: Yayın klasörünü hazırla
        run: |
          rsync -a --exclude tools --exclude README.md store/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
